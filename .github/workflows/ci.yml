name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-action:
    name: Test Action Execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Local Action Test
        uses: ./
        with:
          threshold_monthly_usd: "1000"
          post_pr_comment: "false"
